<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
#stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
img,video{width:100%;height:100%;object-fit:contain}
#empty{color:#fff;font:20px Arial;text-align:center}
</style>
</head>
<body>
<div id="stage"><div id="empty">Nenhuma propaganda ativa cadastrada.</div></div>
<script>
let db, items, index=0, timer=null;

async function load(){
  db=await window.api.getDb();
  items=db.items.filter(x=>x.active);
  index=0;
  show();
}

async function show(){
  clearTimeout(timer);
  const stage=document.getElementById("stage");
  stage.innerHTML="";
  if(!items.length){
    stage.innerHTML='<div id="empty">Nenhuma propaganda ativa cadastrada.</div>';
    timer=setTimeout(load,3000);
    return;
  }

  const item=items[index];
  const url=await window.api.mediaUrl(item.file);

  if(item.type==="video"){
    const v=document.createElement("video");
    v.src=url;
    v.autoplay=true;
    v.muted=true;
    v.playsInline=true;
    v.controls=false;
    v.onended=next;
    v.onerror=next;
    stage.appendChild(v);
  } else {
    const img=document.createElement("img");
    img.src=url;
    img.onerror=next;
    stage.appendChild(img);
    timer=setTimeout(next, Math.max(1,Number(db.settings.photoSeconds)||10)*1000);
  }
}

function next(){
  clearTimeout(timer);
  index=(index+1)%items.length;
  show();
}

load();
setInterval(async()=>{
  const fresh=await window.api.getDb();
  const active=fresh.items.filter(x=>x.active);
  if(JSON.stringify(active)!==JSON.stringify(items)){
    db=fresh; items=active; index=0; show();
  }
},5000);
</script>
</body>
</html>
