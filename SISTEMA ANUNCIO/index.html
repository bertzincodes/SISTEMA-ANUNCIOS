<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema de Propagandas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>Sistema de Propagandas</h1>
    <p>Gerenciamento de fotos e vídeos para monitor vertical</p>
  </div>
  <button id="playerBtn" class="primary">Abrir Player</button>
</header>

<main>
  <section class="cards">
    <div class="card">
      <span>Fotos e vídeos</span>
      <strong id="total">0</strong>
    </div>
    <div class="card">
      <span>Ativos</span>
      <strong id="active">0</strong>
    </div>
    <div class="card">
      <span>Tempo das fotos</span>
      <strong><span id="seconds">10</span>s</strong>
    </div>
  </section>

  <section class="toolbar">
    <button id="addBtn" class="primary">+ Adicionar fotos/vídeos</button>
    <label>Tempo das fotos
      <input id="photoSeconds" type="number" min="1" max="3600" value="10">
      <span>segundos</span>
    </label>
    <button id="saveBtn">Salvar configuração</button>
  </section>

  <section class="list-section">
    <div class="section-title">
      <h2>Playlist</h2>
      <span>Use ↑ ↓ para organizar a ordem</span>
    </div>
    <div id="empty" class="empty">Nenhuma mídia cadastrada.</div>
    <div id="list"></div>
  </section>
</main>
<script src="renderer.js"></script>
</body>
</html>
